services:
  db:
    image: postgres:16
    container_name: vidaplena-db
    restart: unless-stopped            # Disponibilidad: se reinicia solo
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-vidaplena}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"   # solo accesible desde esta computadora
    volumes:
      - vidaplena_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-vidaplena}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  vidaplena_data:
